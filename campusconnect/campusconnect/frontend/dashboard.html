<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;600&display=swap"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>Dashboard | CampusConnect</title>
</head>

<body>

    <!-- Navigation bar -->
    <header class="topbar" id="nav"></header>

    <main class="wrap">

        <!-- Page heading and report button -->
        <div class="page-head">
            <h2>Campus issues</h2>

            <a class="btn" href="create-issue.html">
                Report an issue
            </a>
        </div>

        <!-- Issue status filters -->
        <div class="chips" id="chips"></div>

        <!-- Search and category filters -->
        <div class="filters">

            <label>
                Search
                <input
                    type="search"
                    id="q"
                    placeholder="Fan, Wi-Fi, ID card"
                >
            </label>

            <label>
                Category
                <select id="category">
                    <option value="">All categories</option>
                </select>
            </label>

            <label class="check">
                <input type="checkbox" id="mine">
                Only my issues
            </label>

        </div>

        <!-- Issues will be displayed here -->
        <div id="list" aria-live="polite"></div>

    </main>

    <!-- JavaScript files -->
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
